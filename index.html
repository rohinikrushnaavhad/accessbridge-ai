<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="description" content="AccessBridge AI - Voice-first accessibility assistant">
<title>AccessBridge AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section class="hero">
<div class="logo">AB</div>
<h1>AccessBridge <span>AI</span></h1>
<p>Your voice. Your bridge to the digital world.</p>
</section>

<section class="assistant">
<div class="orb" id="orb">
<div class="orb-core"></div>
</div>
<h2 id="status">Ready to listen</h2>
<p id="message">Tap the button and talk to AccessBridge AI.</p>
<button id="talkBtn" aria-label="Start voice assistant">
<span>🎙️</span>
<span id="talkText">Start AccessBridge</span>
</button>
</section>

<section class="quick">
<div><b>Voice First</b><small>Control with your voice</small></div>
<div><b>Accessible</b><small>Designed for everyone</small></div>
<div><b>AI Powered</b><small>Understand natural commands</small></div>
</section>
</main>
<script src="accessibility.js"></script>
<script src="app.js"></script>
</body>
</html>
